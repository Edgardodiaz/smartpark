
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Acceso administrativo | ParkSmart</title>

    <style>
        /* =========================
           1. Variables generales
        ========================= */

        :root {
            --navy: #10243a;
            --blue: #2563eb;
            --bg: #f3f7fc;
            --ink: #142744;
            --muted: #7184a3;
            --border: #dce6f3;
            --error-bg: #fee7e7;
            --error-text: #a51d1d;
        }

        * {
            box-sizing: border-box;
        }

        /* =========================
           2. Fondo de la página
        ========================= */

        body {
            margin: 0;
            min-height: 100vh;
            padding: 35px 20px;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--ink);

            background:
                radial-gradient(
                    circle at 85% 10%,
                    #d9e8ff 0,
                    transparent 35%
                ),
                radial-gradient(
                    circle at 10% 85%,
                    #e7f1ff 0,
                    transparent 38%
                ),
                var(--bg);
        }

        /* =========================
           3. Tarjeta de inicio
        ========================= */

        .card {
            width: min(100%, 770px);
            padding: 50px;
            background: rgba(255, 255, 255, 0.97);
            border: 1px solid #edf1f7;
            border-radius: 32px;
            box-shadow: 0 25px 75px rgba(35, 74, 125, 0.10);
        }

        /* =========================
           4. Logo centrado
        ========================= */

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 28px;
        }

        .logo {
            display: block;
            width: 145px;
            height: 145px;
            object-fit: contain;
        }

        /* =========================
           5. Título y descripción
        ========================= */

        h1 {
            margin: 0;
            text-align: center;
            color: var(--navy);
            font-size: clamp(26px, 4vw, 38px);
            font-weight: 800;
            letter-spacing: -0.8px;
            line-height: 1.2;
        }

        .description {
            margin: 14px 0 48px;
            text-align: center;
            color: var(--muted);
            font-size: 18px;
            line-height: 1.6;
        }

        /* =========================
           6. Formulario
        ========================= */

        .field {
            display: grid;
            gap: 10px;
            margin-bottom: 28px;
        }

        .field label {
            font-size: 16px;
            font-weight: 700;
            color: var(--navy);
        }

        .field input {
            width: 100%;
            min-height: 66px;
            padding: 18px 22px;
            border: 1.5px solid var(--border);
            border-radius: 17px;
            outline: none;
            background: #fff;
            color: var(--ink);
            font-family: inherit;
            font-size: 17px;
            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .field input::placeholder {
            color: #7b8eac;
            opacity: 1;
        }

        .field input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10);
        }

        /* =========================
           7. Botón de inicio de sesión
        ========================= */

        .btn {
            width: 100%;
            min-height: 68px;
            margin-top: 8px;
            border: none;
            border-radius: 17px;
            background: linear-gradient(110deg, #2563eb, #2161ee);
            color: #fff;
            font-family: inherit;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }

        .btn:hover {
            filter: brightness(1.05);
            box-shadow: 0 9px 22px rgba(37, 99, 235, 0.20);
        }

        .btn:active {
            transform: scale(0.99);
        }

        /* =========================
           8. Mensaje de error
        ========================= */

        .error {
            display: none;
            margin-top: 16px;
            padding: 17px 20px;
            border-radius: 16px;
            background: var(--error-bg);
            color: var(--error-text);
            font-size: 15px;
            line-height: 1.5;
        }

        .error.visible {
            display: block;
        }

        /* =========================
           9. Enlace para regresar
        ========================= */

        .back {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-top: 42px;
            color: var(--muted);
            font-size: 17px;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back:hover {
            color: var(--blue);
        }

        .back-arrow {
            font-size: 24px;
            line-height: 1;
        }

        /* =========================
           10. Adaptación para móviles
        ========================= */

        @media (max-width: 600px) {
            body {
                padding: 18px 12px;
            }

            .card {
                padding: 30px 22px;
                border-radius: 24px;
            }

            .logo {
                width: 115px;
                height: 115px;
            }

            .logo-container {
                margin-bottom: 24px;
            }

            .description {
                font-size: 15px;
                margin-bottom: 32px;
            }

            .field {
                margin-bottom: 22px;
            }

            .field label {
                font-size: 14px;
            }

            .field input {
                min-height: 56px;
                padding: 15px;
                font-size: 15px;
                border-radius: 13px;
            }

            .btn {
                min-height: 58px;
                font-size: 17px;
                border-radius: 13px;
            }

            .back {
                margin-top: 30px;
                font-size: 14px;
            }

            .error {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <!-- Logo centrado -->
        <div class="logo-container">
            <img
                class="logo"
                src="Park.png"
                alt="Logo de ParkSmart"
            >
        </div>

        <!-- Título principal -->
        <h1>Acceso administrativo</h1>

        <p class="description">
            Gestiona espacios, sensores, componentes y registros.
        </p>

        <!-- Formulario -->
        <form id="loginForm">

            <div class="field">
                <label for="email">Correo electrónico</label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="username"
                    placeholder="correo@ejemplo.com"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Contraseña</label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Escribe tu contraseña"
                    required
                >
            </div>

            <button class="btn" type="submit">
                Iniciar sesión
            </button>

            <!-- Error de autenticación -->
            <div
                class="error"
                id="error"
                role="alert"
                aria-live="polite"
            >
                El correo o la contraseña no son correctos.
            </div>

        </form>

        <!-- Volver al inicio -->
        <a class="back" href="index.html">
            <span class="back-arrow" aria-hidden="true">←</span>
            <span>Volver a la página principal</span>
        </a>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        // Obtener el formulario y el mensaje de error.
        const loginForm = document.getElementById("loginForm");
        const errorMessage = document.getElementById("error");

        // Validar las credenciales administrativas.
        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const email = document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();

            const password = document.getElementById("password").value;

            const valid =
                email === "admin@gmail.com" &&
                password === "Admin1234";

            if (valid) {
                // Guardar el rol para el prototipo académico.
                localStorage.setItem("parksmart_role", "admin");

                // Entrar al panel administrativo.
                window.location.href = "panel.html";
            } else {
                // Mostrar el mensaje de error.
                errorMessage.classList.add("visible");
            }
        });

        // Ocultar el error al volver a escribir.
        document
            .getElementById("email")
            .addEventListener("input", hideError);

        document
            .getElementById("password")
            .addEventListener("input", hideError);

        function hideError() {
            errorMessage.classList.remove("visible");
        }
    </script>

</body>
</html>
